# Nginx reverse proxy for Unique Sky Way on Namecheap VPS
# Install: sudo cp deploy/nginx-uniqueskyway.conf /etc/nginx/sites-available/uniqueskyway
#          sudo ln -sf /etc/nginx/sites-available/uniqueskyway /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# SSL: sudo certbot --nginx -d uniqueskyway.com -d www.uniqueskyway.com

upstream uniqueskyway_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect www → apex (adjust if you prefer www as canonical)
server {
    listen 80;
    listen [::]:80;
    server_name www.uniqueskyway.com;
    return 301 https://uniqueskyway.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name uniqueskyway.com;

    # Certbot will add HTTPS listen blocks; keep this for initial HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uniqueskyway.com;

    # Certbot fills these paths after: certbot --nginx -d uniqueskyway.com
    # ssl_certificate     /etc/letsencrypt/live/uniqueskyway.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/uniqueskyway.com/privkey.pem;

    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://uniqueskyway_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://uniqueskyway_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
